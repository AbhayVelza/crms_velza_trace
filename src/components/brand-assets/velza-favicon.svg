<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
<!-- Velza V symbol (brand book master artwork), transparent background.
     Black (positive) on light browser chrome, white (reversed) on dark - brand book pp. 17-18. -->
<style>.on-dark{display:none}@media (prefers-color-scheme: dark){.on-light{display:none}.on-dark{display:inline}}</style>
<image class="on-light" width="64" height="64" href="data:image/png;base64,"/>
<image class="on-dark" width="64" height="64" href="data:image/png;base64,"/>
</svg>
